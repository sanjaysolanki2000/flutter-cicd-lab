name: Build Flutter Flavors
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flavor: [ dev, prod, staging ]
        include:
          - flavor: dev
            target: lib/main_development.dart
          - flavor: staging
            target: lib/main_staging.dart
          - flavor: prod
            target: lib/main_production.dart
    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Set up the Flutter SDK environment
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: 'stable'
          version: '3.47.2' # Specify your preferred version or omit for the latest stable



      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Apk
        run: flutter build apk --flavor ${{matrix.flavor}} -t ${{matrix.target}}

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.flavor }}-release
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk





