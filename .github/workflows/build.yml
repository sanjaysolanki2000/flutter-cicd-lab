name: Build Flutter Flavors
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  build_android:
    name: Build Android ${{ (github.base_ref || github.ref_name) == 'main' && 'Prod' || ((github.base_ref || github.ref_name) == 'staging' && 'Staging' || 'Dev') }}
    runs-on: ubuntu-latest
    env:
      # push pe current branch, PR pe target (base) branch
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set flavor from branch
        run: |
          case "$BRANCH" in
            main)    echo "FLAVOR=prod"    >> $GITHUB_ENV; echo "TARGET=lib/main_production.dart"  >> $GITHUB_ENV ;;
            staging) echo "FLAVOR=staging" >> $GITHUB_ENV; echo "TARGET=lib/main_staging.dart"     >> $GITHUB_ENV ;;
            dev)     echo "FLAVOR=dev"     >> $GITHUB_ENV; echo "TARGET=lib/main_development.dart" >> $GITHUB_ENV ;;
          esac

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: 'stable'
          version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --flavor $FLAVOR -t $TARGET

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.FLAVOR }}-release
          path: build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk

